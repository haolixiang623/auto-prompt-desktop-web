# 开发机专用：SQLite 与用户文件保留在宿主机 /opt/auto-prompt/data，映射为容器 /data
# 直连 Uvicorn 端口（与原先 systemd 暴露 8089 一致），不依赖 nginx 镜像（避免异构架构问题）
# 使用：在 /opt/auto-prompt 下执行 docker-compose -f docker-compose.dev.yml up -d --no-build
version: '3.8'

services:
  app:
    image: auto-prompt-app:dev
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auto-prompt-py
    network_mode: "host"
    volumes:
      - /opt/auto-prompt/data:/data
      - ./logs:/app/logs
    environment:
      - PORT=8089
      - HOST=0.0.0.0
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AUTO_PROMPT_DATA_DIR=/data
      - AUTO_PROMPT_REPO_ROOT=/app
      - AUTO_PROMPT_SKILLS_DIR=/app/skills
      - AUTO_PROMPT_WEB_DIST=/app/dist
      - PYTHONUNBUFFERED=1
    command: ["python", "-m", "uvicorn", "pyserver.app.main:app", "--host", "0.0.0.0", "--port", "8089"]
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8089/api/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
