version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auto-prompt-py
    # 不直接暴露端口到宿主机，通过nginx反向代理访问
    expose:
      - "3000"
    volumes:
      - app-data:/data
      - ./logs:/app/logs
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - AUTO_PROMPT_DATA_DIR=/data
      - AUTO_PROMPT_REPO_ROOT=/app
      - AUTO_PROMPT_SKILLS_DIR=/app/skills
      - AUTO_PROMPT_WEB_DIST=/app/dist
      - PYTHONUNBUFFERED=1
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:3000/api/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - auto-prompt-network

  nginx:
    image: nginx:alpine
    container_name: auto-prompt-nginx
    ports:
      - "8089:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app
    restart: always
    networks:
      - auto-prompt-network

volumes:
  app-data:
    driver: local

networks:
  auto-prompt-network:
    driver: bridge
