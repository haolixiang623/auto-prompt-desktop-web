version: '3.8'

services:
  app:
    image: python:3.9-slim
    container_name: auto-prompt-app
    working_dir: /app
    command: >
      bash -c "
        pip install --no-cache-dir -r pyserver/requirements.txt &&
        python -m uvicorn pyserver.app.main:app --host 0.0.0.0 --port 3000
      "
    volumes:
      - app-data:/data
      - ./logs:/app/logs
      - ./pyserver:/app/pyserver
      - ./src:/app/src
      - ./skills:/app/skills
      - ./材料集:/app/材料集
      - ./分类材料集:/app/分类材料集
      - ./生育津贴支付-材料集:/app/生育津贴支付-材料集
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - AUTO_PROMPT_DATA_DIR=/data
      - AUTO_PROMPT_REPO_ROOT=/app
      - AUTO_PROMPT_SKILLS_DIR=/app/skills
      - AUTO_PROMPT_WEB_DIST=/app/src
      - PYTHONUNBUFFERED=1
    restart: always
    networks:
      - auto-prompt-network

  nginx:
    image: nginx:alpine
    container_name: auto-prompt-nginx
    ports:
      - "8089:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
      - ./src:/usr/share/nginx/html
    depends_on:
      - app
    restart: always
    networks:
      - auto-prompt-network

volumes:
  app-data:
    driver: local

networks:
  auto-prompt-network:
    driver: bridge
