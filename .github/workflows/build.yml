name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            arch: aarch64
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            arch: x86_64
          - platform: windows-latest
            args: ""
            arch: x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        if: matrix.platform == 'windows-latest'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare offline Python runtime
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/prepare_offline_python_runtime.ps1

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.6.1
        id: tauri_build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Auto-Prompt v__VERSION__"
          releaseBody: |
            ## 瀹夎璇存槑

            ### macOS
            - 涓嬭浇 `.dmg` 鏂囦欢瀹夎
            - 棣栨鎵撳紑濡傞亣鈥滄棤娉曢獙璇佸紑鍙戣€呪€濓紝璇峰墠寰€鈥滅郴缁熻缃?-> 瀹夊叏鎬т笌闅愮鈥濈偣鍑烩€滀粛瑕佹墦寮€鈥?
            ### Windows
            - 涓嬭浇 `.exe` 瀹夎鍖?            - Windows NSIS 瀹夎鍖呭凡鍐呯疆 WebView2 绂荤嚎瀹夎鍐呭
            - Windows NSIS 瀹夎鍖呭凡鍐呯疆 Python 杩愯鏃跺拰 `openai`銆乣openpyxl`銆乣pymupdf` 渚濊禆

            ## 閰嶇疆 API Key
            瀹夎鍚庤鍦ㄥ簲鐢ㄢ€滆缃€濋〉闈㈤厤缃€氫箟鍗冮棶 API Key锛坄DASHSCOPE_API_KEY`锛?            [鑾峰彇 API Key](https://dashscope.aliyuncs.com)

            ## Python 渚濊禆
            - Windows 绂荤嚎瀹夎鍖呭凡鍐呯疆 Python 杩愯鏃跺拰蹇呰渚濊禆
            - macOS 鐗堟湰濡傞渶杩愯 Python 鐩稿叧鍔熻兘锛屼粛闇€鑷鍑嗗 Python 鐜
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 7

