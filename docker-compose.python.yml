version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auto-prompt-py
    ports:
      - "3000:3000"
    volumes:
      - app-data:/data
    environment:
      - PORT=3000
      - AUTO_PROMPT_DATA_DIR=/data
      - AUTO_PROMPT_REPO_ROOT=/app
      - AUTO_PROMPT_SKILLS_DIR=/app/skills
      - AUTO_PROMPT_WEB_DIST=/app/dist
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:3000/api/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  app-data:
    driver: local
